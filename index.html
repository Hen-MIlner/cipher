<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cipher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='14' fill='none' stroke='%232b7bff' stroke-width='7' stroke-dasharray='62 26' transform='rotate(40 20 20)'/></svg>">
<style>
:root{--bg:#070d1a;--side:#0a1224;--panel:#0e1a30;--line:#1a2842;--text:#e8eefc;--mute:#7f8fb0;--blue:#2b6bff;--cyan:#1ec8ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{filter:drop-shadow(0 0 10px #1e6bff99)}
.word{letter-spacing:.38em;font-weight:500;font-size:26px}
.hidden{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 50% at 50% 0%,#12306a55,transparent)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px}
.card .logo{justify-content:center;margin-bottom:6px}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{background:none;border:0;padding:8px;border-radius:8px;color:var(--mute)}
.tabs .on{background:var(--blue);color:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--mute);font-size:14px}
.go{width:100%;background:var(--blue);border:0;border-radius:10px;padding:12px;font-weight:600;box-shadow:0 0 20px #2b6bff55}
.err{color:#ff7a8a;min-height:20px;font-size:14px;margin-top:10px}
/* app */
#app{display:grid;grid-template-columns:290px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
aside .logo{padding:0 8px 22px}aside .word{font-size:22px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;color:var(--mute)}
.nav:hover{background:#ffffff08;color:var(--text)}
.nav.on{background:#14306b;color:var(--text)}
.hd{color:var(--mute);font-size:13px;margin:16px 12px 4px}
#hist{overflow:auto;flex:1;min-height:60px}
#hist .nav{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.me{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:#1b3a80;display:grid;place-items:center;font-weight:600}
.me b{display:block;font-weight:500}.me button{background:none;border:0;color:var(--mute);padding:0;font-size:13px}
main{display:flex;flex-direction:column;height:100%;min-width:0;background:radial-gradient(50% 40% at 50% 25%,#10285a44,transparent)}
#feed{flex:1;overflow:auto;padding:24px 20px}
.wrap{max-width:820px;margin:0 auto}
#hero{text-align:center;padding-top:9vh}
#hero .word{display:block;font-size:40px;margin-top:10px}
#hero p{color:var(--mute);font-size:18px;margin:8px 0 34px}
.chips{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left}
.chips div{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.chip{background:#0b1730;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chip:hover{border-color:var(--blue)}
.msg{display:flex;margin:14px 0}.msg.u{justify-content:flex-end}
.bub{max-width:85%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u .bub{background:var(--blue)}.a .bub{background:var(--panel);border:1px solid var(--line)}
pre{background:#050a14;border-radius:10px;padding:12px;overflow:auto;white-space:pre;margin:8px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.bar{padding:0 20px 22px}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-end}
.box:focus-within{border-color:var(--blue)}
textarea{border:0;background:none;resize:none;padding:4px;max-height:160px;outline:none}
#send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);font-size:18px}
#send:disabled{opacity:.4}
#menu{display:none;position:fixed;top:12px;left:12px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:4;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}#menu{display:block}#hero{padding-top:6vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mark" viewBox="0 0 44 44"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ec8ff"/><stop offset="1" stop-color="#2b4bff"/></linearGradient></defs>
<circle cx="22" cy="22" r="15" fill="none" stroke="url(#g)" stroke-width="7" stroke-dasharray="70 24" transform="rotate(38 22 22)"/></symbol></defs></svg>

<section id="auth" class="hidden">
  <form class="card" id="form">
    <div class="logo"><svg width="44" height="44"><use href="#mark"/></svg><span class="word">CIPHER</span></div>
    <p class="sub">Ask anything. Get clear answers.</p>
    <div class="tabs"><button type="button" id="tIn" class="on">Sign in</button><button type="button" id="tUp">Sign up</button></div>
    <label for="name">Your name (this is your username)</label>
    <input type="text" id="name" autocomplete="username" required>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div id="cw" class="hidden"><label for="pw2">Confirm password</label><input type="password" id="pw2" autocomplete="new-password"></div>
    <div class="row"><input type="checkbox" id="rem" checked><label for="rem" style="margin:0">Remember me</label></div>
    <button class="go" id="goBtn">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <button id="menu" aria-label="Menu">☰ Menu</button>
  <aside id="side">
    <div class="logo"><svg width="38" height="38"><use href="#mark"/></svg><span class="word">CIPHER</span></div>
    <button class="nav on" id="newChat">✎ New chat</button>
    <div class="hd">Chat history</div>
    <div id="hist"></div>
    <div class="hd">Tools</div>
    <button class="nav" data-mode="study">🎓 Study mode</button>
    <button class="nav" data-mode="code">&lt;/&gt; Code assistant</button>
    <div class="me" style="margin-top:12px"><div class="av" id="av"></div><div><b id="who"></b><button id="out">Sign out</button></div></div>
  </aside>
  <main>
    <div id="feed"><div class="wrap">
      <div id="hero">
        <svg width="96" height="96" style="filter:drop-shadow(0 0 14px #1e6bff99)"><use href="#mark"/></svg>
        <span class="word">CIPHER</span><p>Ask anything. Get clear answers.</p>
        <div class="chips">You can ask me about…<div id="chips"></div></div>
      </div>
      <div id="msgs"></div>
    </div></div>
    <div class="bar"><div class="box">
      <textarea id="in" rows="1" placeholder="Message Cipher…"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div></div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
let user=null,mode='',chats=[],cur=null,busy=false,signup=false;
const SUG=[['Explain a topic','Explain how black holes form, simply.'],['Help with homework','Help me with my homework. I will paste the question.'],['Write or edit','Help me write a short, friendly email.'],['Summarise','Summarise the text I paste next into 5 bullet points.'],['Search the web','What should I know about this topic?']];
const key=()=>'cipher:'+user.toLowerCase();
async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}

function setTab(up){signup=up;$('#tIn').className=up?'':'on';$('#tUp').className=up?'on':'';$('#cw').classList.toggle('hidden',!up);$('#goBtn').textContent=up?'Create account':'Sign in';$('#pw').autocomplete=up?'new-password':'current-password';$('#err').textContent=''}
$('#tIn').onclick=()=>setTab(false);$('#tUp').onclick=()=>setTab(true);
$('#form').onsubmit=async e=>{e.preventDefault();const err=$('#err');err.textContent='';
  if(signup&&$('#pw').value!==$('#pw2').value){err.textContent='Passwords do not match.';return}
  try{const j=await api('/api/auth?action='+(signup?'signup':'login'),{name:$('#name').value,password:$('#pw').value,remember:$('#rem').checked});start(j.user)}
  catch(x){err.textContent=x.message}};
$('#out').onclick=async()=>{await api('/api/auth?action=logout',{});location.reload()};

function start(name){user=name;chats=JSON.parse(localStorage.getItem(key())||'[]');
  $('#auth').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#who').textContent=name;$('#av').textContent=name[0].toUpperCase();
  $('#chips').innerHTML=SUG.map((s,i)=>`<button class="chip" data-i="${i}">${s[0]}</button>`).join('');
  newChat()}
const save=()=>localStorage.setItem(key(),JSON.stringify(chats.slice(0,40)));
function newChat(){cur={id:Date.now(),title:'New chat',m:[]};render();$('#in').focus()}
function renderHist(){$('#hist').innerHTML=chats.map(c=>`<button class="nav" data-id="${c.id}">${esc(c.title)}</button>`).join('')}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(s){return esc(s).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>`<pre><code>${c}</code></pre>`).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>')}
function render(){const has=cur.m.length>0;$('#hero').classList.toggle('hidden',has);
  $('#msgs').innerHTML=cur.m.map(m=>`<div class="msg ${m.role[0]}"><div class="bub">${m.role==='user'?esc(m.content):md(m.content)}</div></div>`).join('');
  renderHist();$('#feed').scrollTop=1e9}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;$('#send').disabled=true;$('#in').value='';
  cur.m.push({role:'user',content:text});if(cur.m.length===1){cur.title=text.slice(0,40);chats.unshift(cur)}
  cur.m.push({role:'assistant',content:''});render();const out=cur.m[cur.m.length-1];
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,messages:cur.m.slice(0,-1)})});
    if(r.status===401){location.reload();return}
    if(!r.ok)throw new Error((await r.json()).error);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){if(!l.startsWith('data: ')||l.includes('[DONE]'))continue;try{out.content+=JSON.parse(l.slice(6)).choices[0].delta.content||''}catch{}}
      $('#msgs').lastChild.firstChild.innerHTML=md(out.content);$('#feed').scrollTop=1e9}
  }catch(e){out.content=out.content||'⚠️ '+e.message}
  busy=false;$('#send').disabled=false;save();render()}
$('#send').onclick=()=>send($('#in').value);
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#in').value)}};
$('#in').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('#newChat').onclick=()=>{mode='';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('on'));newChat()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)send(SUG[b.dataset.i][1])};
$('#hist').onclick=e=>{const b=e.target.closest('[data-id]');if(b){cur=chats.find(c=>c.id==b.dataset.id);render();$('#side').classList.remove('open')}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const on=mode===b.dataset.mode;mode=on?'':b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));$('#in').focus()});
$('#menu').onclick=()=>$('#side').classList.toggle('open');

api('/api/auth?action=me').then(j=>j.user?start(j.user):$('#auth').classList.remove('hidden')).catch(()=>$('#auth').classList.remove('hidden'));
</script>
</body>
</html>

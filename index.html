<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cipher</title>
<style>
:root{--bg:#070d1a;--side:#0a1224;--panel:#0e1a30;--line:#1a2842;--text:#e8eefc;--mute:#8393b4;--blue:#2b6bff;--cyan:#1ec8ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{flex:none;filter:drop-shadow(0 0 8px #1e6bffaa)}
.word{letter-spacing:.38em;font-weight:500}
#app{display:flex;height:100%}
aside{flex:none;width:280px;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
aside .logo{padding:0 8px 20px}aside .word{font-size:22px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--mute)}
.nav:hover{background:#ffffff0a;color:var(--text)}
.nav.on{background:#14306b;color:var(--text)}
.hd{color:var(--mute);font-size:13px;margin:14px 12px 4px}
#hist{flex:1;overflow:auto;min-height:40px}
#hist .nav{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;display:flex;align-items:center;gap:12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:#1b3a80;display:grid;place-items:center;font-weight:600}
.me b{display:block;font-weight:500}
.me button{background:none;border:0;padding:0;color:var(--mute);font-size:13px}
main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(50% 40% at 50% 22%,#10285a55,transparent)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
#menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#model{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;max-width:70%}
#model option{background:#0e1a30}
#feed{flex:1;overflow:auto;padding:20px}
.wrap{max-width:820px;margin:0 auto}
#hero{text-align:center;padding-top:7vh}
#hero .logo{justify-content:center;flex-direction:column;gap:6px}
#hero .word{font-size:40px;padding-left:.38em}
#hero p{color:var(--mute);font-size:18px;margin:6px 0 30px}
.chips{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left}
.chips div{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{background:#0b1730;border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.chip:hover{border-color:var(--blue)}
.msg{display:flex;margin:14px 0}.msg.u{justify-content:flex-end}
.bub{max-width:88%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u .bub{background:var(--blue)}.a .bub{background:var(--panel);border:1px solid var(--line)}
pre{background:#050a14;border-radius:10px;padding:12px;overflow:auto;margin:8px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.bar{padding:0 20px 20px}
#pill{max-width:820px;margin:0 auto 8px;color:var(--cyan);font-size:13px}
#pill button{background:none;border:0;color:var(--mute)}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-end}
.box:focus-within{border-color:var(--blue)}
textarea{flex:1;border:0;background:none;resize:none;padding:6px 4px;max-height:160px;outline:none}
.ic{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--mute);font-size:18px}
#send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);font-size:18px}
#send:disabled{opacity:.4}
#welcome{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:10}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}
.card .logo{justify-content:center}.card .word{font-size:26px}
.card p{color:var(--mute);margin:10px 0 20px}
.card input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;margin-bottom:12px}
.go{width:100%;background:var(--blue);border:0;border-radius:10px;padding:12px;font-weight:600}
@media(max-width:760px){aside{position:fixed;top:0;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}#menu{display:block}#hero{padding-top:3vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="welcome" class="hidden"><form class="card" id="wf">
  <div class="logo"><span class="m"></span><span class="word">CIPHER</span></div>
  <p>Ask anything. Get clear answers.<br>What's your name?</p>
  <input id="nm" type="text" maxlength="24" placeholder="Your name" autocomplete="given-name" required>
  <button class="go">Start chatting</button>
</form></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="logo"><span class="m"></span><span class="word">CIPHER</span></div>
    <button class="nav on" id="newChat">✎ New chat</button>
    <div class="hd">Chat history</div>
    <div id="hist"></div>
    <div class="hd">Tools</div>
    <button class="nav" data-mode="study">🎓 Study mode</button>
    <button class="nav" data-mode="code">&lt;/&gt; Code assistant</button>
    <div class="me"><div class="av" id="av"></div><div><b id="who"></b><button id="chg">Change name</button></div></div>
  </aside>
  <main>
    <div class="top"><button id="menu">☰</button><select id="model" aria-label="Choose a model"></select></div>
    <div id="feed"><div class="wrap">
      <div id="hero">
        <div class="logo"><span class="m big"></span><span class="word">CIPHER</span></div>
        <p id="hi">Ask anything. Get clear answers.</p>
        <div class="chips">You can ask me about…<div id="chips"></div></div>
      </div>
      <div id="msgs"></div>
    </div></div>
    <div class="bar">
      <div id="pill" class="hidden"></div>
      <div class="box">
        <button class="ic" id="clip" aria-label="Attach a text file" title="Attach a text or code file">📎</button>
        <input type="file" id="file" class="hidden" accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.xml,.yml,.log">
        <textarea id="in" rows="1" placeholder="Message Cipher…"></textarea>
        <button id="send" aria-label="Send">↑</button>
      </div>
    </div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const LOGO=n=>`<svg width="${n}" height="${n}" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="g${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ec8ff"/><stop offset="1" stop-color="#2b4bff"/></linearGradient></defs><circle cx="22" cy="22" r="15" fill="none" stroke="url(#g${n})" stroke-width="7" stroke-dasharray="70 24" transform="rotate(38 22 22)"/></svg>`;
document.querySelectorAll('.m').forEach(e=>e.innerHTML=LOGO(e.classList.contains('big')?96:40));
const SUG=[['Explain a topic','Explain how black holes form, simply.'],['Help with homework','Help me with my homework. I will paste the question.'],['Write or edit','Help me write a short, friendly email.'],['Summarise','Summarise the text I paste next into 5 bullet points.']];
const MODE_NAME={study:'Study mode',code:'Code assistant'};
let name=localStorage.getItem('cipher:name')||'',model=localStorage.getItem('cipher:model')||'',mode='',chats=[],cur=null,busy=false,attach='';
const key=()=>'cipher:chats:'+name.toLowerCase();
async function api(p,body){
  const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  if(!r.ok||!body){const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error("Can't reach the Cipher API. Make sure api/chat.js is in your GitHub repo (inside an api folder), then redeploy on Vercel.")}
    if(!r.ok)throw new Error(j.error||'Request failed');return j}
  return r}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>`<pre><code>${c}</code></pre>`).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');

function start(){
  $('#welcome').classList.add('hidden');$('#app').classList.remove('hidden');
  chats=JSON.parse(localStorage.getItem(key())||'[]');
  $('#who').textContent=name;$('#av').textContent=name[0].toUpperCase();
  $('#hi').textContent=`Hi ${name}. Ask anything. Get clear answers.`;
  $('#chips').innerHTML=SUG.map((s,i)=>`<button class="chip" data-i="${i}">${s[0]}</button>`).join('');
  loadModels();newChat()}
$('#wf').onsubmit=e=>{e.preventDefault();name=$('#nm').value.trim();if(!name)return;localStorage.setItem('cipher:name',name);start()};
$('#chg').onclick=()=>{localStorage.removeItem('cipher:name');location.reload()};

async function loadModels(){
  const sel=$('#model');
  try{const j=await api('/api/chat');
    if(!j.models.length){sel.innerHTML='<option>No model keys set in Vercel</option>';return}
    sel.innerHTML=j.models.map(m=>`<option value="${m.id}">${m.label}</option>`).join('');
    if(!j.models.some(m=>m.id===model))model=j.models[0].id;sel.value=model}
  catch(e){sel.innerHTML='<option>API not found</option>';showErr(e.message)}}
$('#model').onchange=e=>{model=e.target.value;localStorage.setItem('cipher:model',model)};
function showErr(t){cur.m.push({role:'assistant',content:'⚠️ '+t});render()}

const save=()=>localStorage.setItem(key(),JSON.stringify(chats.slice(0,40)));
function newChat(){cur={id:Date.now(),title:'New chat',m:[]};render();$('#in').focus()}
function render(){
  $('#hero').classList.toggle('hidden',cur.m.length>0);
  $('#msgs').innerHTML=cur.m.map(m=>`<div class="msg ${m.role[0]}"><div class="bub">${m.role==='user'?esc(m.content):md(m.content)}</div></div>`).join('');
  $('#hist').innerHTML=chats.map(c=>`<button class="nav" data-id="${c.id}">${esc(c.title)}</button>`).join('');
  $('#feed').scrollTop=1e9}
async function send(text){
  text=text.trim();if((!text&&!attach)||busy)return;
  if(attach){text=(text||'Please look at this file.')+'\n\n--- attached file ---\n'+attach;attach='';setPill()}
  busy=true;$('#send').disabled=true;$('#in').value='';$('#in').style.height='auto';
  cur.m.push({role:'user',content:text});
  if(cur.m.length===1){cur.title=text.slice(0,40);chats.unshift(cur)}
  cur.m.push({role:'assistant',content:''});render();const out=cur.m[cur.m.length-1];
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,model,name,messages:cur.m.slice(0,-1)})});
    if(!r.ok){const t=await r.text();let m;try{m=JSON.parse(t).error}catch{m="Can't reach the Cipher API. Make sure api/chat.js is in your GitHub repo (inside an api folder), then redeploy on Vercel."}throw new Error(m)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){if(!l.startsWith('data: ')||l.includes('[DONE]'))continue;try{out.content+=JSON.parse(l.slice(6)).choices[0].delta.content||''}catch{}}
      $('#msgs').lastChild.firstChild.innerHTML=md(out.content);$('#feed').scrollTop=1e9}
  }catch(e){out.content=out.content||'⚠️ '+e.message}
  busy=false;$('#send').disabled=false;save();render()}

function setPill(){const p=$('#pill');const t=[mode&&MODE_NAME[mode]+' on',attach&&'File attached'].filter(Boolean);
  p.classList.toggle('hidden',!t.length);p.innerHTML=t.join(' · ')+' <button id="x" aria-label="Clear">✕</button>';
  if($('#x'))$('#x').onclick=()=>{mode='';attach='';setPill();syncTools()}}
function syncTools(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=mode===b.dataset.mode?'':b.dataset.mode;syncTools();setPill();$('#in').focus()});
$('#clip').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  if(f.size>100000){showErr('That file is too big. Keep it under 100 KB.');return}
  const r=new FileReader();r.onload=()=>{attach=`(${f.name})\n`+r.result;setPill()};r.readAsText(f);e.target.value=''};
$('#send').onclick=()=>send($('#in').value);
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#in').value)}};
$('#in').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('#newChat').onclick=()=>newChat();
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)send(SUG[b.dataset.i][1])};
$('#hist').onclick=e=>{const b=e.target.closest('[data-id]');if(b){cur=chats.find(c=>c.id==b.dataset.id);render();$('#side').classList.remove('open')}};
$('#menu').onclick=()=>$('#side').classList.toggle('open');

if(name)start();else{$('#welcome').classList.remove('hidden');$('#nm').focus()}
</script>
</body>
</html>
